<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enklaspel.online - Portfölj</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <!-- Google Font: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link 
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" 
    rel="stylesheet">
</head>
<body>
  <!-- Header med navigation för desktop -->
  <header>
    <h1>projekt</h1>
    <nav class="header-nav">
      <div class="dropdown">
        <span class="dropbtn">appar</span>
        <div class="dropdown-content" id="appsList">
          <a href="app1.html" data-id="app1">App 1</a>
          <a href="app2.html" data-id="app2">App 2</a>
          <a href="app3.html" data-id="app3">App 3</a>
          <!-- Fler appar kan läggas till här -->
        </div>
      </div>
      <div class="dropdown">
        <span class="dropbtn">spel</span>
        <div class="dropdown-content" id="gamesList">
          <a href="klockan/index.html" class="load-project">klockan</a>
          <a href="engelska/index.html" class="load-project">engelska</a>
          <a href="engelska2/index.html" class="load-project" id="engelska2">engelska två</a>
          <!-- Fler spel kan läggas till här -->
        </div>
      </div>
    </nav>
  </header>
  
  <!-- Huvudinnehållsområde för desktop -->
  <main id="contentArea">
    <p>Välj ett projekt från menyn ovan.</p>
  </main>

  <!-- Mobil-flikmeny -->
  <div class="mobile-tabs">
    <button class="tab-btn active" data-target="apps">Appar</button>
    <button class="tab-btn" data-target="games">Spel</button>
  </div>

  <!-- Mobilinnehåll med flikindelning -->
  <div class="mobile-content">
    <!-- Appar-flik -->
    <div id="apps" class="tab-content active">
      <a href="app1.html" data-id="app1">App 1</a>
      <a href="app2.html" data-id="app2">App 2</a>
      <a href="app3.html" data-id="app3">App 3</a>
    </div>
    <!-- Spel-flik -->
    <div id="games" class="tab-content">
      <a href="klockan/index.html" class="load-project">klockan</a>
      <a href="engelska/index.html" class="load-project">engelska</a>
      <a href="engelska2/index.html" class="load-project" id="engelska2">engelska två</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
